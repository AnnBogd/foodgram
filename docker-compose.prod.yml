volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # image: annbogd/foodgram_backend
    env_file: .env
    restart: always
    volumes:
      - static:/backend_static
      - media:/app/media
      - ./data:/app/data
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    # image: annbogd/foodgram_frontend
    command: cp -r build/. /static/
    volumes:
      - static:/static
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    # image: annbogd/foodgram_gateway
    env_file: .env
    ports:
      - 8200:80
    volumes:
      - static:/static
      - media:/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: always